name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

env:
  JAVA_VERSION: '17'
  ANDROID_API: '35'
  ANDROID_BUILD_TOOLS: '35.0.0'
  ANDROID_HOME: /opt/android-sdk
  ANDROID_SDK_ROOT: /opt/android-sdk

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Android command line tools
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$ANDROID_HOME"

          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdline-tools.zip
            rm -rf /tmp/cmdline-tools
            unzip -q /tmp/cmdline-tools.zip -d /tmp
            rm -rf "$ANDROID_HOME/cmdline-tools"
            mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
            cp -a /tmp/cmdline-tools/. "$ANDROID_HOME/cmdline-tools/latest/"
          fi

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --install "platform-tools" "platforms;android-${ANDROID_API}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Install Gradle
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /opt/gradle
          curl -fsSL https://services.gradle.org/distributions/gradle-9.1.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-9.1.1/bin" >> "$GITHUB_PATH"

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build debug APK
        shell: bash
        run: |
          set -euxo pipefail
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: صلمة-الصلاة-debug-apk
          path: app/build/outputs/apk/debug/*.apk
